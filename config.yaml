# ============================================================================
# QUASAR - QUantitative Automated Stock ARbiter
# Configuration file. All tunables live here.
# ============================================================================

broker:
  # Which broker to use for live/paper trading. Options: paper | dhan | groww
  # Secrets are read from ENV vars (${VAR}) so they never live in this file.
  # Export them in your shell, e.g.:
  #   export DHAN_CLIENT_ID=... DHAN_CLIENT_SECRET=... DHAN_ACCESS_TOKEN=...
  #   export GROWW_API_KEY=... GROWW_API_SECRET=...
  mode: paper
  live_trading: false        # set true to send REAL orders (paper by default)
  dhan:
    client_id: "${DHAN_CLIENT_ID}"
    client_secret: "${DHAN_CLIENT_SECRET}"
    access_token: "${DHAN_ACCESS_TOKEN}"
  groww:
    api_key: "${GROWW_API_KEY}"
    api_secret: "${GROWW_API_SECRET}"

universe:
  # Trade EVERYTHING: liquid indices + the full Nifty 50 stock list (NSE .NS).
  # In live F&O trading, replace this with the broker's entire instrument master
  # (all index + stock futures) — the strategy runs identically on each name.
  source: static
  indices:
    - ^NSEI
    - ^NSEBANK
    - ^NSEFIN
    - ^NSEMID
  symbols:
    - RELIANCE.NS
    - TCS.NS
    - HDFCBANK.NS
    - INFY.NS
    - HINDUNILVR.NS
    - ICICIBANK.NS
    - ITC.NS
    - KOTAKBANK.NS
    - BHARTIARTL.NS
    - LT.NS
    - AXISBANK.NS
    - ASIANPAINT.NS
    - MARUTI.NS
    - SUNPHARMA.NS
    - TITAN.NS
    - NTPC.NS
    - POWERGRID.NS
    - ONGC.NS
    - HCLTECH.NS
    - BAJFINANCE.NS
    - BAJAJFINSV.NS
    - TATAMOTORS.NS
    - WIPRO.NS
    - ULTRACEMCO.NS
    - ADANIPORTS.NS
    - COALINDIA.NS
    - DRREDDY.NS
    - EICHERMOT.NS
    - GRASIM.NS
    - SBIN.NS
    - INDUSINDBK.NS
    - CIPLA.NS
    - TECHM.NS
    - NESTLEIND.NS
    - TATASTEEL.NS
    - BAJAJ-AUTO.NS
    - HEROMOTOCO.NS
    - HDFCLIFE.NS
    - SBILIFE.NS
    - BRITANNIA.NS
    - DIVISLAB.NS
    - APOLLOHOSP.NS
    - M&M.NS
    - JSWSTEEL.NS
    - TATACONSUM.NS
    - UPL.NS
    - SHREECEM.NS
    - ADANIENT.NS

strategy:
  # Active strategy. Options: multi_trend | futures_trend | index_trend | ensemble | futures_ensemble | diversified_trend | overnight | momentum | mean_reversion
  active: diversified_trend

  index_trend:
    trade_symbol: NIFTYBEES.NS   # ETF used as the execution vehicle
    regime_index: ^NSEI         # Nifty index used for the trend/vol signal
    mode: above_ma              # above_ma | cross
    ma_window: 50
    fast: 20
    slow: 50
    vol_target: 0.15            # target annualised vol (leverage scales to this)
    max_leverage: 1.5
    vol_window: 20

  # --- alternative strategies (selectable via strategy.active) ---
  ensemble:
    momentum: 0.65
    mean_reversion: 0.35

  momentum:
    lookback_days: 126
    skip_days: 21
    top_n: 10
    min_dollar_vol: 5e6
    rebalance: ME
    regime_index: ^NSEI
    regime_ma: 200

  mean_reversion:
    rsi_period: 14
    rsi_oversold: 32
    rsi_overbought: 62
    bb_period: 20
    bb_std: 2.0
    hold_days: 10
    regime_index: ^NSEI
    regime_ma: 200

  overnight:
    trade_symbol: NIFTYBEES.NS
    regime_index: ^NSEI
    regime_ma: 200
    mode: index
    top_n: 10
    rebalance: W

  futures_trend:
    index: ^NSEI           # trade this index's FUTURES (Nifty). Use ^NSEBANK for Bank Nifty
    mode: above_ma         # above_ma | cross
    ma_window: 50
    fast: 20
    slow: 50
    vol_target: 0.18       # target annualised vol -> leverage applied to futures
    max_leverage: 3.0      # hard cap on futures leverage
    vol_window: 20
    long_only: true        # true = long when trend up, flat when down (no shorting)

  # Multi-instrument trend portfolio: runs the trend rule on EVERY instrument in
  # `instruments` (all indices + all stocks) and combines them with equal risk
  # contribution (risk parity), scaled to a portfolio vol target. This is the
  # "trade everything" mode. In live trading, set instruments: null and the bot
  # pulls the broker's full F&O instrument master automatically.
  multi_trend:
    instruments: ["^NSEI", "^NSEBANK", "^NSEFIN", "^NSEMID"]   # index-FUTURES only (Option A)
    mode: above_ma
    ma_window: 75          # two-way trend filter (long above both MAs, short below both)
    fast: 20
    slow: 50
    trend_ma: 200          # primary-trend MA: used as the confirmation gate + strength measure
    primary_gate: true     # ONLY trade with trend confirmation (above/below BOTH MAs) -> no whipsaw
    strength_band: 0.03    # fast/slow MA gap that counts as "full strength" (scales leverage)
    instr_vol: 0.10        # per-instrument vol target (drives risk-parity weight = 1/vol)
    portfolio_vol: 0.15    # target portfolio volatility (leverage scaled to this)
    max_leverage: 2.0      # cap on any single instrument's leverage
    gross_cap: 3.0         # cap on total gross notional (sum of |weights|)
    vol_window: 20
    long_only: false       # TWO-WAY: trend-follow both directions (profits in down/shock markets too)

  # Two-way futures ENSEMBLE: average of TREND + BOLLINGER + BREAKOUT alpha on each
  # index future. Decorrelated signals -> lower drawdown & less chop-bleed than any
  # single signal, while still profiting in up AND down/shock regimes. Validated
  # OOS: Sharpe 0.51, DD -13%, +14% in COVID crash, +2.3% in recent selloff.
  futures_ensemble:
    instruments: ["^NSEI", "^NSEBANK", "^NSEFIN", "^NSEMID"]   # index-FUTURES only (Option A)
    ma_window: 75          # trend filter (long above both MAs, short below both)
    trend_ma: 200          # primary-trend MA: confirmation gate + strength measure
    primary_gate: true     # trade only with trend confirmation (above/below BOTH MAs) -> no whipsaw
    strength_band: 0.03    # fast/slow MA gap that counts as "full strength"
    boll_k: 20             # Bollinger window
    boll_std: 2.0          # Bollinger std multiplier
    breakout_n: 20         # breakout channel length
    instr_vol: 0.10        # per-instrument vol target (drives leverage = vol_target/realised_vol)
    max_leverage: 2.0      # cap on any single instrument's leverage
    vol_window: 20
    long_only: false       # TWO-WAY: profits in down/shock markets too
    w_trend: 1.0           # signal weights (averaged)
    w_boll: 1.0
    w_breakout: 1.0

  # Diversified multi-asset TWO-WAY trend book (the convincible strategy).
  # Validated walk-forward (2014-20->21-22, 14-22->23-24, 14-24->25-26): ALL
  # three out-of-sample folds POSITIVE (CAGR +1.4%/+8.2%/+1.6%), Sharpe 0.2-0.9,
  # DD ~-20%. The edge comes from UNCORRELATED assets (equities/bonds/gold/
  # commodities/crypto), not the signal - this is what 2 correlated indices
  # could never deliver. INDA proxies NIFTY so India stays in the book. For live
  # Indian F&O, apply the SAME config to Dhan's full index+stock futures universe.
  diversified_trend:
    instruments: ["SPY","QQQ","IWM","EFA","EEM","INDA","TLT","IEF","GLD","SLV","DBC","USO","VNQ","XLK","GBTC"]
    ma_window: 100           # walk-forward winning trend filter
    trend_ma: 200            # confirmation gate + strength measure
    primary_gate: true       # long above BOTH MAs, short below BOTH (no whipsaw)
    strength_band: 0.03
    instr_vol: 0.10          # per-instrument vol target (risk-parity weight = 1/vol)
    portfolio_vol: 0.10      # target portfolio vol (lower DD, still positive OOS)
    max_leverage: 2.0
    gross_cap: 3.0           # cap gross notional (diversification allows more)
    vol_window: 20
    long_only: false         # TWO-WAY: profits in down/shock markets too

  regime_filter:
    enabled: true
    index: ^NSEI
    ma_window: 50

# F&O-specific cost & risk assumptions (futures: low STT + exchange charges)
costs_futures:
  cost_pct: 0.0007         # ~0.07% round-trip all-in (STT 0.02% sell + exchange 0.004% + brokerage + GST + slippage)
  stop_pct: 0.10           # wider stop -> let futures trends run (was 0.06, exited on noise)
  account_dd: 0.25         # flatten & halt new entries if account drawdown hits 25%
  max_leverage: 2.0        # cap on gross futures leverage (matches validated backtest)

risk:
  max_positions: 12
  max_weight_per_position: 1.5   # allows full + leveraged single-asset exposure (index_trend)
  stop_loss_pct: 0.08          # hard stop per position
  target_drawdown_pct: 0.15    # circuit breaker: halt new entries above this DD
  volatility_target: 0.12      # annualized vol target for risk-parity sizing
  cash_buffer: 0.05            # keep 5% cash

costs:
  commission_pct: 0.0005       # 0.05% per side (discount broker)
  stt_pct: 0.00025             # securities transaction tax (equity delivery)
  slippage_pct: 0.0005         # assumed execution slippage per side
  impact_pct: 0.0005           # market impact for larger orders

backtest:
  start: "2016-01-01"
  end: "2024-12-31"
  benchmark: NIFTYBEES.NS
  initial_capital: 1000000.0   # INR 10 lakh

logging:
  level: INFO
  dir: logs
