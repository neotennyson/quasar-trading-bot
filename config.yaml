# ============================================================================
# QUASAR - QUantitative Automated Stock ARbiter
# Configuration file. All tunables live here.
# ============================================================================

broker:
  # Which broker to use for live/paper trading. Options: paper | dhan | groww
  # Secrets are read from ENV vars (${VAR}) so they never live in this file.
  # Export them in your shell, e.g.:
  #   export DHAN_CLIENT_ID=... DHAN_CLIENT_SECRET=... DHAN_ACCESS_TOKEN=...
  #   export GROWW_API_KEY=... GROWW_API_SECRET=...
  mode: paper
  live_trading: false        # set true to send REAL orders (paper by default)
  dhan:
    client_id: "${DHAN_CLIENT_ID}"
    client_secret: "${DHAN_CLIENT_SECRET}"
    access_token: "${DHAN_ACCESS_TOKEN}"
  groww:
    api_key: "${GROWW_API_KEY}"
    api_secret: "${GROWW_API_SECRET}"

universe:
  # Trade EVERYTHING: liquid indices + the full Nifty 50 stock list (NSE .NS).
  # In live F&O trading, replace this with the broker's entire instrument master
  # (all index + stock futures) — the strategy runs identically on each name.
  source: static
  indices:
    - ^NSEI
    - ^NSEBANK
    - ^NSEFIN
    - ^NSEMID
  symbols:
    - RELIANCE.NS
    - TCS.NS
    - HDFCBANK.NS
    - INFY.NS
    - HINDUNILVR.NS
    - ICICIBANK.NS
    - ITC.NS
    - KOTAKBANK.NS
    - BHARTIARTL.NS
    - LT.NS
    - AXISBANK.NS
    - ASIANPAINT.NS
    - MARUTI.NS
    - SUNPHARMA.NS
    - TITAN.NS
    - NTPC.NS
    - POWERGRID.NS
    - ONGC.NS
    - HCLTECH.NS
    - BAJFINANCE.NS
    - BAJAJFINSV.NS
    - TATAMOTORS.NS
    - WIPRO.NS
    - ULTRACEMCO.NS
    - ADANIPORTS.NS
    - COALINDIA.NS
    - DRREDDY.NS
    - EICHERMOT.NS
    - GRASIM.NS
    - SBIN.NS
    - INDUSINDBK.NS
    - CIPLA.NS
    - TECHM.NS
    - NESTLEIND.NS
    - TATASTEEL.NS
    - BAJAJ-AUTO.NS
    - HEROMOTOCO.NS
    - HDFCLIFE.NS
    - SBILIFE.NS
    - BRITANNIA.NS
    - DIVISLAB.NS
    - APOLLOHOSP.NS
    - M&M.NS
    - JSWSTEEL.NS
    - TATACONSUM.NS
    - UPL.NS
    - SHREECEM.NS
    - ADANIENT.NS

strategy:
  # Active strategy. Options: multi_trend | futures_trend | index_trend | ensemble | overnight | momentum | mean_reversion
  active: multi_trend

  index_trend:
    trade_symbol: NIFTYBEES.NS   # ETF used as the execution vehicle
    regime_index: ^NSEI         # Nifty index used for the trend/vol signal
    mode: above_ma              # above_ma | cross
    ma_window: 50
    fast: 20
    slow: 50
    vol_target: 0.15            # target annualised vol (leverage scales to this)
    max_leverage: 1.5
    vol_window: 20

  # --- alternative strategies (selectable via strategy.active) ---
  ensemble:
    momentum: 0.65
    mean_reversion: 0.35

  momentum:
    lookback_days: 126
    skip_days: 21
    top_n: 10
    min_dollar_vol: 5e6
    rebalance: ME
    regime_index: ^NSEI
    regime_ma: 200

  mean_reversion:
    rsi_period: 14
    rsi_oversold: 32
    rsi_overbought: 62
    bb_period: 20
    bb_std: 2.0
    hold_days: 10
    regime_index: ^NSEI
    regime_ma: 200

  overnight:
    trade_symbol: NIFTYBEES.NS
    regime_index: ^NSEI
    regime_ma: 200
    mode: index
    top_n: 10
    rebalance: W

  futures_trend:
    index: ^NSEI           # trade this index's FUTURES (Nifty). Use ^NSEBANK for Bank Nifty
    mode: above_ma         # above_ma | cross
    ma_window: 50
    fast: 20
    slow: 50
    vol_target: 0.18       # target annualised vol -> leverage applied to futures
    max_leverage: 3.0      # hard cap on futures leverage
    vol_window: 20
    long_only: true        # true = long when trend up, flat when down (no shorting)

  # Multi-instrument trend portfolio: runs the trend rule on EVERY instrument in
  # `instruments` (all indices + all stocks) and combines them with equal risk
  # contribution (risk parity), scaled to a portfolio vol target. This is the
  # "trade everything" mode. In live trading, set instruments: null and the bot
  # pulls the broker's full F&O instrument master automatically.
  multi_trend:
    instruments: null      # null => use config.universe (indices + all listed stocks)
    mode: above_ma
    ma_window: 50
    fast: 20
    slow: 50
    instr_vol: 0.10        # per-instrument vol target (drives risk-parity weight = 1/vol)
    portfolio_vol: 0.15    # target portfolio volatility (leverage scaled to this)
    max_leverage: 2.0      # cap on any single instrument's leverage
    gross_cap: 3.0         # cap on total gross notional (sum of |weights|)
    vol_window: 20
    long_only: true

  regime_filter:
    enabled: true
    index: ^NSEI
    ma_window: 50

# F&O-specific cost & risk assumptions (futures: low STT + exchange charges)
costs_futures:
  cost_pct: 0.0002         # ~0.02% round-trip (STT 0.01% + exchange + brokerage)
  stop_pct: 0.06           # exit a trade if index moves 6% against entry
  account_dd: 0.25         # flatten & halt new entries if account drawdown hits 25%

risk:
  max_positions: 12
  max_weight_per_position: 1.5   # allows full + leveraged single-asset exposure (index_trend)
  stop_loss_pct: 0.08          # hard stop per position
  target_drawdown_pct: 0.15    # circuit breaker: halt new entries above this DD
  volatility_target: 0.12      # annualized vol target for risk-parity sizing
  cash_buffer: 0.05            # keep 5% cash

costs:
  commission_pct: 0.0005       # 0.05% per side (discount broker)
  stt_pct: 0.00025             # securities transaction tax (equity delivery)
  slippage_pct: 0.0005         # assumed execution slippage per side
  impact_pct: 0.0005           # market impact for larger orders

backtest:
  start: "2016-01-01"
  end: "2024-12-31"
  benchmark: NIFTYBEES.NS
  initial_capital: 1000000.0   # INR 10 lakh

logging:
  level: INFO
  dir: logs
